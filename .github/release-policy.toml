# The release bot (.github/workflows/release-bot.yml) reads this file on every run. It cuts
# a release only when every rule here allows one, and never while an issue labeled
# release-blocker is open.

# "off": the bot does nothing
# "dry-run": plan and build the release commit in CI, show the diff, push nothing
# "release": land the commit on master, tag it, and publish the GitHub release
mode = "dry-run"

# Days to wait after the latest release, counted from its CHANGELOG date. 0 releases after
# every batch of merges.
min_days_between = 0

# A batch ends when this many minutes pass after a push to master with no other push. Each
# push restarts the wait, so a run of merges gives one release. A run started by hand
# skips the wait.
quiet_minutes = 30

# A change to any of these paths since the previous tag makes the release MINOR (failure
# modes, requirements, or schemas); otherwise it is PATCH. fnmatch patterns, where "*" also
# matches "/". The bot never bumps MAJOR: that is a person's decision.
minor_paths = ["challenges/0*", "requirements/*", "schemas/*"]

# Lines the release commit rewrites besides CHANGELOG.md. Each pattern must match exactly
# once in its file. The replacement can use {version} (1.10.0), {minor} (1.10), and {date}
# (2026-10-05). The workflow then runs scripts/sync-skill-references.sh, so the bundled
# copies under skills/ follow.
[[version_lines]]
file = "README.md"
pattern = 'CLI Agent Spec v\d+\.\d+(?= —)'
replace = "CLI Agent Spec v{minor}"

[[version_lines]]
file = "comparison-matrix.md"
pattern = 'CLI Agent Spec v\d+\.\d+(?= —)'
replace = "CLI Agent Spec v{minor}"

[[version_lines]]
file = "requirements/index.md"
pattern = 'CLI Agent Spec v\d+\.\d+(?= —)'
replace = "CLI Agent Spec v{minor}"
