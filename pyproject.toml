[project]
name = "cli-agent-spec-tools"
version = "0.0.0"
description = "Validation and conformance tooling for the CLI Agent Spec corpus"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
